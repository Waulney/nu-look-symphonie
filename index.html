<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mots Cachés - Symphonie</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="game-container">
    
    <!-- EN-TÊTE -->
    <header>
      <div class="brand">
        <!-- Icône thématique Clé de Sol / Musique -->
        <span class="music-icon" style="font-size: 1.5rem; line-height: 1;">🎼</span>
        <h1 id="level-title">NU LOOK SYMPHONIE</h1>
      </div>

      <div class="controls">
        <select id="select-level" aria-label="Sélectionner un niveau"></select>
        <button id="theme-toggle" aria-label="Changer le thème">🌓</button>
      </div>
    </header>

    <!-- ZONE DE JEU PRINCIPALE -->
    <main class="main-content">
      
      <!-- GRILLE DE JEU -->
      <section id="grid-container" aria-label="Grille de mots cachés"></section>

      <!-- BARRE LATÉRALE / LISTE DES MOTS -->
      <aside class="sidebar">
        <h2>Mots à trouver</h2>
        <ul id="words-list"></ul>
      </aside>

    </main>

  </div>

  <script src="script.js"></script>
</body>
</html>
